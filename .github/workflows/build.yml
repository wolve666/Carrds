name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Leggo la versione da www/index.html
        id: v
        run: echo "ver=$(grep -oP "APP_VERSION = '\K[0-9.]+" www/index.html)" >> $GITHUB_OUTPUT

      - run: npm install
      - run: npx cap add android

      - name: Icona
        run: npx --yes @capacitor/assets generate --android

      - name: Permesso fotocamera, versione
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.ver }}\"/" android/app/build.gradle

      - run: npx cap sync android

      - name: Compilo
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Firmo
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ks.jks
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass "pass:${{ secrets.KEYSTORE_PASS }}" --out Carrds.apk aligned.apk

      - name: Pubblico la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: Carrds v${{ steps.v.outputs.ver }}
          files: Carrds.apk
          make_latest: true
